services:
  redis:
    image: redis:7
    container_name: carbon-redis

  api:
    build: .
    command: uvicorn carbon:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./detrixai.json:/app/detrixai.json:ro
      - ./detrixai.json:/detrixai.json:ro
      - ./utils:/app/utils
      - ./tasks.py:/app/tasks.py
      - ./services:/app/services
      - ./routes:/app/routes
      - ./database:/app/database
      - cog-store:/app/cog_exports
    depends_on:
      - redis
    restart: always

  worker:
    build: .
    # ADDED: --pool=solo to prevent Fork Poisoning
    command: celery -A worker.celery_app worker --pool=solo --loglevel=info
    env_file:
      - .env
    environment:
      - KMP_DUPLICATE_LIB_OK=TRUE
      - OMP_NUM_THREADS=1
    volumes:
      - ./detrixai.json:/app/detrixai.json:ro
      - ./detrixai.json:/detrixai.json:ro
      - ./utils:/app/utils
      - ./tasks.py:/app/tasks.py
      - ./services:/app/services
      - ./routes:/app/routes
      - ./database:/app/database
      - cog-store:/app/cog_exports
    depends_on:
      - redis
    restart: always

  beat:
    build: .
    command: celery -A worker.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - KMP_DUPLICATE_LIB_OK=TRUE
      - OMP_NUM_THREADS=1
    volumes:
      - ./detrixai.json:/app/detrixai.json:ro
      - ./detrixai.json:/detrixai.json:ro
      - ./utils:/app/utils
      - ./tasks.py:/app/tasks.py
      - ./services:/app/services
    depends_on:
      - redis
    restart: always

  # ── TiTiler Dynamic Tile Server ───────────────────────────────────────────
  # Serves Cloud Optimized GeoTIFFs (COGs) as on-the-fly XYZ raster tiles
  # for hardware-accelerated MapLibre GL JS overlays.
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: carbon-titiler
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      # ── GDAL / VSI performance tuning for COG streaming ──────────────────
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif,.tiff
      - GDAL_CACHEMAX=512
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=536870912
      # ── TiTiler listens on 8000 internally ───────────────────────────────
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - cog-store:/data/cogs:ro
    restart: always

volumes:
  cog-store:
    driver: local
