<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stomata</title>
    <link rel="icon" href="/assets/stomata_logo.jpeg" type="image/jpeg">
    <meta name="description" content="Sign in to the Biochar Carbon-Removal MRV by Stomata.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #0f172a;
            --bg-card: rgba(15, 23, 42, 0.65);
            --bg-input: rgba(15, 23, 42, 0.5);
            --border: rgba(56, 189, 248, 0.15);
            --border-focus: rgba(56, 189, 248, 0.5);
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --green-accent: #34d399;
            --red-accent: #f87171;
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* ── Animated background ─────────────────────────────── */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            z-index: 0;
            animation: glow-drift 12s ease-in-out infinite alternate;
        }

        .bg-glow--cyan {
            background: var(--accent);
            top: -200px;
            right: -100px;
        }

        .bg-glow--emerald {
            background: var(--green-accent);
            bottom: -200px;
            left: -100px;
            animation-delay: -6s;
        }

        @keyframes glow-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(40px, 30px) scale(1.15);
            }
        }

        /* ── Layout ──────────────────────────────────────────── */
        .auth-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            animation: fade-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Brand header ────────────────────────────────────── */
        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-glow), rgba(52, 211, 153, 0.2));
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            animation: pulse-ring 3s ease-in-out infinite;
        }

        @keyframes pulse-ring {

            0%,
            100% {
                box-shadow: 0 0 0 0 var(--accent-glow);
            }

            50% {
                box-shadow: 0 0 30px 6px var(--accent-glow);
            }
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent), var(--green-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.4rem;
        }

        /* ── Card ────────────────────────────────────────────── */
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        /* ── Form elements ───────────────────────────────────── */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 0.875rem 0.75rem 2.75rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.925rem;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: rgba(15, 23, 42, 0.7);
        }

        .form-input:focus~.input-icon,
        .form-input:focus+.input-icon {
            color: var(--accent);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        /* ── Checkbox ────────────────────────────────────────── */
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            background: var(--bg-input);
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s, background 0.2s;
        }

        .checkbox-label input[type="checkbox"]:checked {
            border-color: var(--accent);
            background: var(--accent);
        }

        .checkbox-label input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 5px;
            height: 9px;
            border: solid var(--bg-primary);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .forgot-link {
            font-size: 0.85rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--accent-hover);
        }

        /* ── Buttons ─────────────────────────────────────────── */
        .btn-primary {
            width: 100%;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            border: none;
            border-radius: var(--radius-sm);
            color: #0c1524;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.15));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-primary:hover::before {
            opacity: 1;
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(12, 21, 36, 0.3);
            border-top-color: #0c1524;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        .btn-primary.loading .btn-text {
            display: none;
        }

        .btn-primary.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Divider ─────────────────────────────────────────── */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── OAuth buttons ───────────────────────────────────── */
        .oauth-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn-oauth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
        }

        .btn-oauth:hover {
            border-color: var(--border-focus);
            background: rgba(15, 23, 42, 0.8);
            transform: translateY(-1px);
        }

        .btn-oauth svg {
            width: 18px;
            height: 18px;
        }

        /* ── Footer ──────────────────────────────────────────── */
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-footer a:hover {
            color: var(--accent-hover);
        }

        /* ── Toast / Alert ───────────────────────────────────── */
        .toast {
            display: none;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            border: 1px solid;
            animation: toast-in 0.3s ease;
        }

        .toast.show {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toast--error {
            background: rgba(248, 113, 113, 0.1);
            border-color: rgba(248, 113, 113, 0.3);
            color: var(--red-accent);
        }

        .toast--success {
            background: rgba(52, 211, 153, 0.1);
            border-color: rgba(52, 211, 153, 0.3);
            color: var(--green-accent);
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Back link ───────────────────────────────────────── */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-secondary);
        }

        /* ── Responsive ──────────────────────────────────────── */
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem;
            }

            .oauth-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--cyan"></div>
    <div class="bg-glow bg-glow--emerald"></div>

    <div class="auth-wrapper">
        <div class="auth-container">
            <!-- Brand -->
            <div class="brand">
                <div class="brand-icon">
                    <img src="/assets/stomata_logo.jpeg" alt="Stomata Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                </div>
                <h1>Biochar MRV by Stomata</h1>
                <p>Sign in to your account</p>
            </div>

            <!-- Auth Card -->
            <div class="auth-card">
                <!-- Toast alert -->
                <div class="toast" id="toast-alert" role="alert">
                    <span id="toast-icon"></span>
                    <span id="toast-message"></span>
                </div>

                <!-- Login Form -->
                <form id="loginForm" onsubmit="event.preventDefault(); return false;" autocomplete="on">
                    <div class="form-group">
                        <label class="form-label" for="email">Email address</label>
                        <div class="input-wrapper">
                            <input class="form-input" type="email" id="email" name="email" placeholder="you@company.com"
                                required autocomplete="email">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="4" width="20" height="16" rx="2" />
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                            </svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-wrapper">
                            <input class="form-input" type="password" id="password" name="password"
                                placeholder="••••••••" required autocomplete="current-password" minlength="6">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                            <button type="button" class="password-toggle" id="toggle-password"
                                aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eye-icon">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me">
                            Remember me
                        </label>
                        <a href="#" class="forgot-link" id="forgot-password-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary" id="login-btn">
                        <span class="btn-text">Sign In</span>
                        <span class="spinner"></span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider">or continue with</div>

                <!-- OAuth -->
                <div class="oauth-grid">
                    <button class="btn-oauth" id="google-login" type="button">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                                fill="#4285F4" />
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853" />
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                fill="#FBBC05" />
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335" />
                        </svg>
                        Google
                    </button>
                    <button class="btn-oauth" id="github-login" type="button">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
                        </svg>
                        GitHub
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <p class="auth-footer">
                Don't have an account? <a href="signup.html">Create one</a>
            </p>

            <a href="https://app.stomata.tech" class="back-link">← Back to Stomata Platform</a>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ─── Supabase Configuration ─────────────────────────────
        const SUPABASE_URL = 'https://yrjiiacdxknesvpaxdjr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyamlpYWNkeGtuZXN2cGF4ZGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MjIwODMsImV4cCI6MjA5NTA5ODA4M30.ieQV-H7HPFj6ihBkWDoZv68klpvwT4iUCD6O7R2h6Lg';

        let supabaseClient = null;
        try {
            if (window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        // ─── DOM References ─────────────────────────────────────
        const loginForm = document.getElementById('loginForm') || document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');
        const toast = document.getElementById('toast-alert');
        const toastIcon = document.getElementById('toast-icon');
        const toastMsg = document.getElementById('toast-message');

        // ─── Toast Helper ───────────────────────────────────────
        function showToast(message, type = 'error') {
            toast.className = `toast show toast--${type}`;
            toastIcon.textContent = type === 'error' ? '⚠' : '✓';
            toastMsg.textContent = message;
            if (type === 'success') {
                setTimeout(() => { toast.className = 'toast'; }, 4000);
            }
        }

        function hideToast() {
            toast.className = 'toast';
        }

        // ─── Check existing session ─────────────────────────────
        if (supabaseClient) {
            supabaseClient.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    window.location.replace('/app.html');
                }
            }).catch(e => console.error("Session check error:", e));
        }

        // ─── Toggle Password Visibility ─────────────────────────
        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.innerHTML = isPassword
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
        });

        // ─── Login Form Submission ──────────────────────────────
        async function handleLoginSubmit(e) {
            if (e) e.preventDefault();
            hideToast();

            if (!supabaseClient) {
                showToast('Database SDK failed to load. Please check your network.');
                return false;
            }

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showToast('Please enter both email and password.');
                return false;
            }

            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password,
                });

                if (error) {
                    showToast(error.message || 'Invalid login credentials.');
                } else if (data && data.session) {
                    showToast('Sign in successful! Redirecting…', 'success');
                    setTimeout(() => {
                        window.location.replace('/app.html');
                    }, 600);
                } else {
                    showToast('Please confirm your email address before signing in.');
                }
            } catch (err) {
                showToast('An unexpected error occurred during sign in.');
                console.error(err);
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
            return false;
        }

        loginForm.addEventListener('submit', handleLoginSubmit);

        // ─── OAuth Handlers ─────────────────────────────────────
        document.getElementById('google-login').addEventListener('click', async () => {
            if (!supabaseClient) return showToast('Supabase SDK not loaded.');
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + '/app.html' }
            });
            if (error) showToast(error.message);
        });

        document.getElementById('github-login').addEventListener('click', async () => {
            if (!supabaseClient) return showToast('Supabase SDK not loaded.');
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'github',
                options: { redirectTo: window.location.origin + '/app.html' }
            });
            if (error) showToast(error.message);
        });

        // ─── Forgot Password ────────────────────────────────────
        document.getElementById('forgot-password-link').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (!email) {
                showToast('Enter your email address first, then click forgot password.');
                emailInput.focus();
                return;
            }

            if (!supabaseClient) return showToast('Supabase SDK not loaded.');

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/pages/auth/login.html',
                });
                if (error) {
                    showToast(error.message);
                } else {
                    showToast('Password reset email sent! Check your inbox.', 'success');
                }
            } catch (err) {
                showToast('Failed to send reset email. Please try again.');
            }
        });
    </script>
</body>

</html>
