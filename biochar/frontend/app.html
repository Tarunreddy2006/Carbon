    <!-- Fast auth pre-check (before any rendering) -->
    <script>
        (function () {
            var hasSession = false;
            try {
                var keys = Object.keys(localStorage);
                for (var i = 0; i < keys.length; i++) {
                    if (keys[i].indexOf('sb-') === 0 && keys[i].indexOf('-auth-token') !== -1) {
                        hasSession = true;
                        break;
                    }
                }
            } catch (e) { }
            if (!hasSession) {
                window.location.replace('/pages/auth/login.html');
            }
            // Apply saved theme immediately to prevent flash
            var t = localStorage.getItem('carbonos-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <!-- 4. Master Application Runtime Initialization Engine -->
    <script>
        // ── Helper to execute database onboarding ──
        async function completeLazyOnboarding(sessionUser) {
            const supabase = window.supabaseClient;
            if (!supabase) return;

            console.log("🚀 Running post-verification onboarding...");
            
            const meta = sessionUser.user_metadata;
            const orgName = meta?.org_name || 'My Organization';
            const firstName = meta?.first_name || '';
            const lastName = meta?.last_name || '';
            const phone = meta?.phone || '';

            try {
                // Step B: Insert Organization
                const { data: org, error: orgError } = await supabase
                    .from('organizations')
                    .insert({
                        name: orgName,
                        email: sessionUser.email,
                        phone: phone,
                        subscription_plan: 'Trial',
                        subscription_status: 'Active'
                    })
                    .select()
                    .single();

                if (orgError) throw orgError;

                // Step C: Insert Profile
                const { error: profileError } = await supabase.from('profiles').insert({
                    id: sessionUser.id,
                    first_name: firstName,
                    last_name: lastName,
                    phone: phone,
                    organization_id: org.id
                });
                if (profileError) throw profileError;

                // Step D: Get Role ID
                const { data: roleRow, error: roleError } = await supabase
                    .from('roles')
                    .select('id')
                    .eq('name', 'Owner')
                    .single();
                if (roleError) throw new Error("Role 'Owner' could not be resolved.");

                // Step E: Insert Membership
                const { error: memberError } = await supabase.from('organization_members').insert({
                    organization_id: org.id,
                    user_id: sessionUser.id,
                    role_id: roleRow.id
                });
                if (memberError) throw memberError;

                console.log("✅ Onboarding successful.");
                window.location.reload(); // Refresh to load new context
            } catch (setupErr) {
                console.error("Onboarding failed:", setupErr);
            }
        }

        (async function bootstrap() {
            // Initialize appearance themes
            Theme.init();
            const session = await window.getSession();
            if(!session) {
                window.location.replace('/pages/auth/login.html');
                return;
            }
            let profile = await window.getUserProfile();
            if (!profile) {
                const sessionUser = session.user;
                const meta = sessionUser.user_metadata;
                const orgName = meta?.org_name || 'My Organization';
                const firstName = meta?.first_name || '';
                const lastName = meta?.last_name || '';
                const phone = meta?.phone || '';
                try {
                    const { data: org, error: orgError } = await window.supabaseClient
                    .from('organizations')
                        .insert({
                        name: orgName,
                        email: sessionUser.email,
                        phone: phone,
                        subscription_plan: 'Trial',
                        subscription_status: 'Active'
                    })
                    .select()
                    .single(); 
                if (orgError) throw orgError;
                if (org) {
                    const { error: profileError } = await window.supabaseClient
                        .from('profiles')
                        .insert({
                            id: sessionUser.id,
                            first_name: firstName,
                            last_name: lastName,
                            phone: phone,
                            organization_id: org.id
                        });

                    if (profileError) throw profileError;

                    // Step D: Query predefined roles table to pull 'Owner' ID[cite: 6]
                    const { data: roleRow, error: roleError } = await window.supabaseClient
                        .from('roles')
                        .select('id')
                        .eq('name', 'Owner')
                        .single();

                    if (roleError) throw new Error("Role 'Owner' could not be resolved.");

                    // Step E: Link user context inside organization_members[cite: 6]
                    const { error: memberError } = await window.supabaseClient
                        .from('organization_members')
                        .insert({
                            organization_id: org.id,
                            user_id: sessionUser.id,
                            role_id: roleRow.id
                        });

                    if (memberError) throw memberError;

                    // Clear local cache layers and force-refresh the profile memory context
                    window.clearProfileCache();
                    profile = await window.getUserProfile();
                    console.log("🎉 Onboarding transaction completed successfully.");
                }
            } catch (setupErr) {
                console.error("Critical organization onboarding transaction failed:", setupErr);
                alert('Account verified, but database organization setup failed: ' + setupErr.message);
                return;
            }
        }
            Auth._user=session.user;
            Auth._profile=profile;
            // Sync verified account layouts
            Auth.populateUI();
            document.getElementById('dropdown-user-name').textContent = Auth.displayName;
            document.getElementById('dropdown-user-email').textContent = Auth.user?.email || '';

            // Register single-page navigation components
            Router.register('/dashboard', { title: 'Dashboard', render: DashboardModule.render });
            Router.register('/projects', { title: 'Projects', render: ProjectsModule.render });
            Router.register('/feedstock', { title: 'Feedstock', render: FeedstockModule.render });
            Router.register('/batches', { title: 'Biochar Batches', render: BatchesModule.render });
            Router.register('/pyrolysis', { title: 'Pyrolysis Telemetry', render: PyrolysisModule.render });
            Router.register('/laboratory', { title: 'Laboratory', render: LaboratoryModule.render });
            Router.register('/distribution', { title: 'Distribution', render: DistributionModule.render });
            Router.register('/settings', { title: 'Settings', render: SettingsModule.render });

            // Fire routing listener
            Router.init('content');
            
            // ── Sidebar Interceptors ─────────────────────────────────
            const sidebar = document.getElementById('sidebar');
            const appShell = document.getElementById('app-shell');

            document.getElementById('sidebar-toggle-btn').addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
                appShell.classList.toggle('sidebar-collapsed');
                localStorage.setItem('carbonos-sidebar', sidebar.classList.contains('collapsed') ? 'collapsed' : 'expanded');
            });

            if (localStorage.getItem('carbonos-sidebar') === 'collapsed') {
                sidebar.classList.add('collapsed');
                appShell.classList.add('sidebar-collapsed');
            }

            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const route = link.dataset.route;
                    if (route) Router.navigate(route);
                    sidebar.classList.remove('mobile-open');
                    document.getElementById('sidebar-overlay').classList.remove('visible');
                });
            });

            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                sidebar.classList.add('mobile-open');
                document.getElementById('sidebar-overlay').classList.add('visible');
            });

            document.getElementById('sidebar-overlay').addEventListener('click', () => {
                sidebar.classList.remove('mobile-open');
                document.getElementById('sidebar-overlay').classList.remove('visible');
            });

            // ── Theme Adjuster ───────────────────────────────────────
            document.getElementById('theme-toggle-btn').addEventListener('click', () => {
                Theme.toggle();
            });

            // ── User Identity Dropdown ──────────────────────────────
            const userBtn = document.getElementById('topbar-user-btn');
            const userDropdown = document.getElementById('user-dropdown');

            userBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                userDropdown.classList.toggle('open');
            });

            document.addEventListener('click', () => {
                userDropdown.classList.remove('open');
            });

            // ── Safe Corporate Logout Action ────────────────────────
            document.getElementById('logout-btn').addEventListener('click', async () => {
                // Safely references our classic object wrapper to flush session states cleanly
                if (window.SupabaseAuthHelpers) {
                    await window.SupabaseAuthHelpers.signOut();
                } else {
                    window.location.replace('/pages/auth/login.html');
                }
            });

        })();
    </script>
