    <!-- Fast auth pre-check (before any rendering) -->
    <script>
        (function () {
            var hasSession = false;
            try {
                var keys = Object.keys(localStorage);
                for (var i = 0; i < keys.length; i++) {
                    if (keys[i].indexOf('sb-') === 0 && keys[i].indexOf('-auth-token') !== -1) {
                        hasSession = true;
                        break;
                    }
                }
            } catch (e) { }
            if (!hasSession) {
                window.location.replace('/pages/auth/login.html');
            }
            // Apply saved theme immediately to prevent flash
            var t = localStorage.getItem('carbonos-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <!-- 4. Master Application Runtime Initialization Engine -->
    <script>
        // ── Helper to execute database onboarding ──
        async function completeLazyOnboarding(sessionUser) {
            const supabaseClient = window.supabaseClient;
            if (!supabaseClient) return null;

            console.log("🚀 Running post-verification onboarding...");

            try {
                // Step A: Authenticate user using getUser()
                const { data: authData, error: authError } = await supabaseClient.auth.getUser();
                if (authError || !authData || !authData.user) {
                    console.error("Onboarding authentication check failed:", authError);
                    return null;
                }
                const authenticatedUser = authData.user;
                const authenticatedUserId = authenticatedUser.id;

                const meta = authenticatedUser.user_metadata || sessionUser?.user_metadata;
                const orgName = meta?.org_name || 'My Organization';
                const firstName = meta?.first_name || '';
                const lastName = meta?.last_name || '';
                const phone = meta?.phone || '';
                const email = authenticatedUser.email || sessionUser?.email || '';

                let activeOrgId = null;

                // Step B: Check if an organization already exists in DB (or by email)
                try {
                    const { data: existingOrgs } = await supabaseClient
                        .from('organizations')
                        .select('id, email')
                        .order('legal_name', { ascending: false, nullsFirst: false })
                        .limit(1);

                    if (existingOrgs && existingOrgs.length > 0) {
                        activeOrgId = existingOrgs[0].id;
                        console.log("Found existing organization in DB:", activeOrgId);
                    }
                } catch (findErr) {
                    console.warn("Failed to lookup existing organization:", findErr);
                }

                // Step C: If no organization exists, create one
                if (!activeOrgId) {
                    activeOrgId = (typeof Utils !== 'undefined' && Utils.uuid) ? Utils.uuid() :
                        ((typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                            const r = Math.random() * 16 | 0;
                            const v = c === 'x' ? r : (r & 0x3 | 0x8);
                            return v.toString(16);
                        }));

                    console.log("Creating new initial organization:", activeOrgId);
                    const { error: orgError } = await supabaseClient
                        .from('organizations')
                        .insert({
                            id: activeOrgId,
                            name: orgName,
                            email: email,
                            phone: phone,
                            subscription_plan: 'Trial',
                            subscription_status: 'Active'
                        });

                    if (orgError) {
                        console.warn("organizations insert warning:", orgError);
                        // If unique constraint error on email, fetch existing organization by email or limit
                        const { data: fallbackOrgs } = await supabaseClient
                            .from('organizations')
                            .select('id')
                            .limit(1);
                        if (fallbackOrgs && fallbackOrgs.length > 0) {
                            activeOrgId = fallbackOrgs[0].id;
                        }
                    }
                }

                // Step D: Guarantee profile exists and link organization_id
                const profilePayload = {
                    id: authenticatedUserId,
                    first_name: firstName,
                    last_name: lastName,
                    phone: phone,
                    organization_id: activeOrgId,
                    updated_at: new Date().toISOString()
                };

                try {
                    const { error: pErr } = await supabaseClient
                        .from('profiles')
                        .update({ organization_id: activeOrgId, updated_at: new Date().toISOString() })
                        .eq('id', authenticatedUserId);

                    if (pErr) {
                        await supabaseClient.from('profiles').upsert(profilePayload);
                    }
                } catch (pErr) {
                    console.warn("Profile setup warning:", pErr);
                }

                // Step E: Fetch Owner role ID
                let roleId = 1;
                try {
                    const { data: roleRow } = await supabaseClient
                        .from('roles')
                        .select('id')
                        .eq('name', 'Owner')
                        .maybeSingle();
                    if (roleRow?.id) roleId = roleRow.id;
                } catch (rErr) {
                    console.warn("Role lookup warning, defaulting to 1 (Owner):", rErr);
                }

                // Step F: Insert into organization_members safely
                const membershipPayload = {
                    organization_id: activeOrgId,
                    user_id: authenticatedUserId,
                    role_id: roleId,
                    status: 'Active',
                    joined_at: new Date().toISOString()
                };

                try {
                    await supabaseClient.from('organization_members').insert(membershipPayload);
                } catch (mErr) {
                    console.warn("Membership insert warning (non-fatal):", mErr);
                }

                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('stomata_active_org_id', activeOrgId);
                }

                console.log("✅ Onboarding complete for org:", activeOrgId);
                if (typeof window.clearProfileCache === 'function') window.clearProfileCache();
                if (typeof AuthRepository !== 'undefined') {
                    return await AuthRepository.getProfileAndPermissions(sessionUser);
                }
                return await window.getUserProfile();
            } catch (setupErr) {
                console.warn("Onboarding non-fatal exception:", setupErr);
                return null;
            }
        }


        (async function bootstrap() {
            // Bootstrap Offline Subsystem first
            if (typeof OfflineDB !== 'undefined') {
                try {
                    await OfflineDB.open();
                    Connectivity.init();
                    SyncEngine.init();
                    OfflineStorage.init();
                    OfflineUI.init();
                } catch (offlineErr) {
                    console.error("Failed to initialize offline subsystem:", offlineErr);
                }
            }

            // Initialize appearance themes
            Theme.init();

            // Invoke Auth guard to load session, profile, organization, and role context
            let profile = await Auth.guard();
            if (!profile) return; // Auth.guard handles redirect to login if no session

            // If profile does not have an organization resolved, execute onboarding
            if (!profile.organization_id) {
                profile = await completeLazyOnboarding(Auth.user);
                if (!profile) return; // onboarding failed
                // Re-initialize Auth with the new profile containing organization
                Auth._profile = profile;
            }

            // Sync verified account layouts
            Auth.populateUI();
            if (typeof Permissions !== 'undefined') {
                Permissions.updateSidebar();
            }
            document.getElementById('dropdown-user-name').textContent = Auth.displayName;
            document.getElementById('dropdown-user-email').textContent = Auth.user?.email || '';

            // Register single-page navigation components
            Router.register('/dashboard', { title: 'Dashboard', render: container => DashboardModule.render(container) });
            Router.register('/projects', { title: 'Projects', render: container => ProjectsModule.render(container) });
            Router.register('/feedstock', { title: 'Feedstock', render: container => FeedstockModule.render(container) });
            Router.register('/batches', { title: 'Biochar Batches', render: container => BatchesModule.render(container) });
            Router.register('/pyrolysis', { title: 'Pyrolysis Telemetry', render: container => PyrolysisModule.render(container) });
            Router.register('/laboratory', { title: 'Laboratory', render: container => LaboratoryModule.render(container) });
            Router.register('/distribution', { title: 'Distribution', render: container => DistributionModule.render(container) });
            Router.register('/settings', { title: 'Settings', render: container => SettingsModule.render(container) });
            Router.register('/evidence', { title: 'Evidence', render: container => EvidenceModule.render(container) });
            Router.register('/users', {
                title: 'Users',
                render: async (container) => {
                    if (typeof Permissions !== 'undefined' && Permissions.hasPermission('manage_users')) {
                        Router.navigate('/settings');
                        setTimeout(() => {
                            const tab = document.querySelector('.tab[data-tab="members"]');
                            if (tab) tab.click();
                        }, 100);
                    } else if (typeof Router !== 'undefined') {
                        Router._renderAccessDenied();
                    }
                }
            });

            // Fire routing listener
            Router.init('content');

            // ── Sidebar Interceptors ─────────────────────────────────
            const sidebar = document.getElementById('sidebar');
            const appShell = document.getElementById('app-shell');

            document.getElementById('sidebar-toggle-btn').addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
                appShell.classList.toggle('sidebar-collapsed');
                localStorage.setItem('carbonos-sidebar', sidebar.classList.contains('collapsed') ? 'collapsed' : 'expanded');
            });

            if (localStorage.getItem('carbonos-sidebar') === 'collapsed') {
                sidebar.classList.add('collapsed');
                appShell.classList.add('sidebar-collapsed');
            }

            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const route = link.dataset.route;
                    if (route) Router.navigate(route);
                    sidebar.classList.remove('mobile-open');
                    document.getElementById('sidebar-overlay').classList.remove('visible');
                });
            });

            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                sidebar.classList.add('mobile-open');
                document.getElementById('sidebar-overlay').classList.add('visible');
            });

            document.getElementById('sidebar-overlay').addEventListener('click', () => {
                sidebar.classList.remove('mobile-open');
                document.getElementById('sidebar-overlay').classList.remove('visible');
            });

            // ── Theme Adjuster ───────────────────────────────────────
            document.getElementById('theme-toggle-btn').addEventListener('click', () => {
                Theme.toggle();
            });

            // ── User Identity Dropdown ──────────────────────────────
            const userBtn = document.getElementById('topbar-user-btn');
            const userDropdown = document.getElementById('user-dropdown');

            userBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                userDropdown.classList.toggle('open');
            });

            document.addEventListener('click', () => {
                userDropdown.classList.remove('open');
            });

            // ── Safe Corporate Logout Action ────────────────────────
            document.getElementById('logout-btn').addEventListener('click', async () => {
                if (window.signOut) {
                    await window.signOut();
                } else if (window.handleLogout) {
                    await window.handleLogout();
                } else {
                    window.location.replace('/pages/auth/login.html');
                }
            });

        })();
    </script>
</body>

</html>
